<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reception Chat Inbox | Nile Century Hospital</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#102c46;--teal:#087f8c;--line:#d9e5e8;--ink:#203342;--g:#3f8f2f;--n:#2a2c7c;--r:#e01f26;--c:#fff;--t:#1c2233;--l:#dfe8e2}
*{box-sizing:border-box}body{margin:0;background:#f3f7f9;color:var(--ink);font:15px/1.5 Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--c);border-bottom:1px solid var(--l);padding:4px 20px}
header .w{max-width:1360px;margin:auto;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0;color:inherit;text-decoration:none}
header .brand img{height:72px;width:auto;max-width:130px;object-fit:contain;background:#fff;border-radius:6px}
.bn{display:flex;flex-direction:column;line-height:1.05}
.bn b{font:700 1.5rem/1 Fraunces,Georgia,serif;letter-spacing:.4px;background:linear-gradient(90deg,var(--g),var(--n));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;white-space:nowrap}
.bn small{display:flex;align-items:center;gap:8px;margin-top:5px;font:800 .7rem 'Nunito Sans',system-ui,sans-serif;letter-spacing:.46em;text-transform:uppercase;color:var(--r)}
.bn small:after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--r),transparent)}
header nav{display:flex;gap:22px;flex-wrap:nowrap;white-space:nowrap;font:800 .94rem 'Nunito Sans',system-ui,sans-serif}
header nav a{color:var(--t);text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent;transition:.25s}
header nav a:hover,header nav a.on{color:var(--g);border-color:var(--g)}
.hr{display:flex;align-items:center;gap:22px;flex-shrink:0}

.btn{position:relative;overflow:hidden;display:inline-block;padding:9px 14px;border-radius:8px;border:2px solid var(--g);background:var(--g);color:#fff;font:800 .88rem/1.2 'Nunito Sans',system-ui,sans-serif;white-space:nowrap;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s,color .25s,filter .25s}

.btn::after{content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s;pointer-events:none}

.btn:focus-visible{outline:3px solid var(--r);outline-offset:3px}

.btn:active{transform:scale(.96)}
.btn.off{background:#536875;border-color:#536875}
.btn.rv{background:var(--n);border-color:var(--n)}
@media(hover:hover){.btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(42,44,124,.3);filter:brightness(1.08);background:var(--n);border-color:var(--n);color:#fff}header .btn:hover::after,.btn:hover::after{left:130%}.btn.rv:hover{background:var(--g);border-color:var(--g);box-shadow:0 8px 20px rgba(63,143,47,.35)}.btn:disabled:hover{transform:none;box-shadow:none;filter:none}}
@media(max-width:560px){header{padding:4px 12px}header .w{gap:8px}header .brand img{height:50px}.brand{gap:8px}.bn b{font-size:1.02rem}.bn small{font-size:.55rem;letter-spacing:.3em;margin-top:3px}header nav{gap:12px;font-size:.82rem}.hr{gap:10px}header .btn{padding:8px 9px;font-size:.78rem}}
@media(max-width:400px){.bn small{display:none}header nav{gap:9px;font-size:.76rem}header .brand img{height:44px}.hr{gap:7px}header .btn{padding:8px 7px;font-size:.74rem}}
main{max-width:1100px;margin:24px auto;padding:0 14px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:18px}
input,textarea{width:100%;padding:11px;border:1px solid #cbd9de;border-radius:8px;font:inherit;margin:5px 0 12px}
button{background:var(--teal);color:white;border:0;border-radius:8px;padding:10px 15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.55}
#login{max-width:420px;margin:50px auto}#loginBtn{display:block;width:100%;padding:12px 14px;font-size:1rem}.lglogo{display:block;width:170px;max-width:60%;height:auto;margin:0 auto 6px}#app{display:none}.layout{display:grid;grid-template-columns:330px 1fr;gap:15px}
#threads{max-height:70vh;overflow:auto} .thread{display:block;width:100%;text-align:left;background:#f7fafb;color:var(--ink);border:1px solid var(--line);margin:0 0 8px;padding:12px}
.thread.active{border-color:var(--teal);background:#eaf6f6}.thread small{display:block;color:#637680;font-weight:normal}
#conversation{height:48vh;min-height:300px;overflow:auto;background:#f8fbfc;border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:85%;padding:10px 12px;background:#e9f0f3;border-radius:11px;overflow-wrap:anywhere}.msg.staff{align-self:flex-end;background:#d8f1ec}.msg small{display:block;color:#627681;font-size:11px;margin-top:4px}
#replyrow{display:flex;gap:8px;margin-top:10px}#reply{flex:1;min-height:60px}
#status{color:var(--teal);min-height:22px;font-size:13px}
@media(max-width:760px){.layout{grid-template-columns:1fr}#threads{max-height:240px}#conversation{height:40vh}}
</style></head>

<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" class="btn" type="button">Sign in</button><div id="loginStatus"></div></section>
<section id="app"><div class="layout">
<div class="card"><h2>Conversations</h2><div id="threads">Loading conversations...</div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 id="chatTitle">Select a conversation</h2><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button id="soundToggle" class="btn" type="button">Sound: ON</button></div></div><div id="alertStatus" style="font-size:13px;color:#087f8c;min-height:20px" aria-live="polite"></div><div id="conversation"></div>
<div id="replyrow"><textarea id="reply" placeholder="Write a reply..." maxlength="2000"></textarea><button id="replyBtn" class="btn rv">Reply</button></div><div id="status"></div></div>
</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
 const URL='https://cmsxkczawawiyoamywnz.supabase.co',KEY='sb_publishable_8aJbvv-rmzaF9KUMQoRlig_uv1kNa4u';
 const db=window.supabase.createClient(URL,KEY);
 const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let current=null,rows=[],poll=null;
 let knownMessageIds=new Set(), firstRefresh=true, soundEnabled=true, audioContext=null;
 const readPositionKey='nileHospitalChatReadPositions';
 let readPositions={};
 try{readPositions=JSON.parse(localStorage.getItem(readPositionKey)||'{}')||{};}catch(e){}
 function saveReadPositions(){try{localStorage.setItem(readPositionKey,JSON.stringify(readPositions));}catch(e){}}
 function playAlert(){
  if(!soundEnabled)return;
  try{
   const AudioCtx=window.AudioContext||window.webkitAudioContext;
   if(!AudioCtx)return;
   audioContext=audioContext||new AudioCtx();
   if(audioContext.state==='suspended')audioContext.resume();
   const now=audioContext.currentTime;
   [0,0.24,0.48].forEach((offset,i)=>{
    const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
    oscillator.type='sine';oscillator.frequency.value=[660,880,1040][i];
    gain.gain.setValueAtTime(0.0001,now+offset);
    gain.gain.exponentialRampToValueAtTime(0.75,now+offset+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.242);
    oscillator.connect(gain);gain.connect(audioContext.destination);
    oscillator.start(now+offset);oscillator.stop(now+offset+0.24);
   });
  }catch(e){}
 }
 function notifyNewMessages(messages){
  if(!messages.length)return;
  playAlert();
  const count=messages.length;
  $('alertStatus').textContent=count+' new visitor message'+(count===1?'':'s')+' received.';
  if(document.hidden && 'Notification' in window && Notification.permission==='granted'){
   try{new Notification('Nile Century Hospital – New chat message',{body:count===1?'A visitor sent a new message.':count+' new visitor messages received.'});}catch(e){}
  }
 }
 function activateSound(){
  try{
   const AudioCtx=window.AudioContext||window.webkitAudioContext;
   if(AudioCtx){audioContext=audioContext||new AudioCtx();if(audioContext.state==='suspended')audioContext.resume();}
  }catch(e){}
 }
 $('loginBtn').addEventListener('click',activateSound);
 $('password').addEventListener('keydown',e=>{if(e.key==='Enter')activateSound();});
 $('soundToggle').onclick=()=>{activateSound();
  soundEnabled=!soundEnabled;
  $('soundToggle').textContent='Sound: '+(soundEnabled?'ON':'OFF');
  $('soundToggle').classList.toggle('off',!soundEnabled);
  if(soundEnabled)playAlert();
 };

 function showApp(){ $('hdr').style.display='';$('logout').style.display='inline-block';$('login').style.display='none';$('app').style.display='block';refresh();if(poll)clearInterval(poll);poll=setInterval(refresh,5000); }
 $('loginBtn').onclick=async()=>{ $('loginStatus').textContent='Signing in...';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginStatus').textContent='Sign-in failed. Check your email and password.';return;}const {data:{user}}=await db.auth.getUser();const {data:allowed,error:checkError}=await db.rpc('is_hospital_admin');if(checkError||!allowed){await db.auth.signOut();$('loginStatus').textContent='This account is not authorized for the reception inbox. Ask the administrator to add it to hospital_admins.';return;}showApp();};
 $('logout').onclick=async()=>{if(poll)clearInterval(poll);await db.auth.signOut();current=null;$('hdr').style.display='none';$('logout').style.display='none';$('app').style.display='none';$('login').style.display='block';$('loginStatus').textContent='Signed out.';};
 async function refresh(){
  const {data,error}=await db.from('chat_messages').select('id,conversation_id,sender_type,sender_name,message,created_at').order('id',{ascending:true}).limit(1000);
  if(error){$('threads').textContent='Could not load conversations. Confirm the chat SQL setup has been run.';return;}
  rows=data||[];
  const newVisitorMessages=[];
  rows.forEach(m=>{
   const id=String(m.id);
   if(!knownMessageIds.has(id) && !firstRefresh && m.sender_type==='visitor')newVisitorMessages.push(m);
   knownMessageIds.add(id);
  });
  if(!firstRefresh)notifyNewMessages(newVisitorMessages);
  firstRefresh=false;
  const map=new Map();rows.forEach(m=>{if(!map.has(m.conversation_id))map.set(m.conversation_id,[]);map.get(m.conversation_id).push(m);});
  let initialized=false;
  try{initialized=localStorage.getItem('nileHospitalChatReadInitialized')==='1';}catch(e){}
  if(!initialized){
   map.forEach((msgs,id)=>{readPositions[id]=Math.max(0,...msgs.map(m=>Number(m.id)||0));});
   saveReadPositions();
   try{localStorage.setItem('nileHospitalChatReadInitialized','1');}catch(e){}
  }
  if(current){
   const currentMsgs=map.get(current)||[];
   readPositions[current]=Math.max(Number(readPositions[current])||0,...currentMsgs.map(m=>Number(m.id)||0));
   saveReadPositions();
  }
  const list=[...map.entries()].sort((a,b)=>new Date(b[1][b[1].length-1].created_at)-new Date(a[1][a[1].length-1].created_at));
  $('threads').innerHTML=list.length?'':'No messages yet.';
  list.forEach(([id,msgs])=>{const last=msgs[msgs.length-1],visitor=msgs.find(x=>x.sender_type==='visitor');const b=document.createElement('button');b.className='thread'+(current===id?' active':'');const unread=msgs.filter(m=>m.sender_type==='visitor'&&(Number(m.id)||0)>(Number(readPositions[id])||0)).length;b.innerHTML='<strong>'+esc(visitor?.sender_name||'Website visitor')+(unread?' <span style="display:inline-block;background:#d62828;color:white;border-radius:999px;min-width:22px;padding:1px 7px;text-align:center;font-size:12px;margin-left:5px">'+unread+'</span>':'')+'</strong><small>'+esc(last.message.slice(0,90))+'</small><small>'+esc(new Date(last.created_at).toLocaleString())+'</small>';b.onclick=()=>{current=id;readPositions[id]=Math.max(Number(readPositions[id])||0,...msgs.map(m=>Number(m.id)||0));saveReadPositions();drawConversation();refresh();};$('threads').appendChild(b);});
  if(current)drawConversation();
 }
 function drawConversation(){
  const list=rows.filter(m=>m.conversation_id===current);const first=list.find(m=>m.sender_type==='visitor');
  $('chatTitle').textContent=first?.sender_name||'Visitor conversation';$('conversation').innerHTML='';
  list.forEach(m=>{const el=document.createElement('div');el.className='msg '+(m.sender_type==='staff'?'staff':'');el.innerHTML='<strong>'+esc(m.sender_type==='staff'?'NCH':m.sender_name)+'</strong><div>'+esc(m.message).replace(/\n/g,'<br>')+'</div><small>'+esc(new Date(m.created_at).toLocaleString())+'</small>';$('conversation').appendChild(el);});
  $('conversation').scrollTop=$('conversation').scrollHeight;
 }
 $('replyBtn').onclick=async()=>{const message=$('reply').value.trim();if(!current){$('status').textContent='Select a conversation first.';return;}if(!message){$('status').textContent='Write a reply first.';return;}$('replyBtn').disabled=true;$('status').textContent='Sending...';const {error}=await db.from('chat_messages').insert({conversation_id:current,sender_type:'staff',sender_name:'NCH',message});$('replyBtn').disabled=false;if(error){$('status').textContent='Reply not sent. Check your staff access.';return;}$('reply').value='';$('status').textContent='Reply sent.';await refresh();};
 db.auth.getSession().then(async({data:{session}})=>{if(session){const {data:allowed,error}=await db.rpc('is_hospital_admin');if(!error&&allowed)showApp();}});
})();
</script></body></html>
