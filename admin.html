
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nile Century Hospital — Reception Dashboard</title>
<style>
:root{font-family:Arial,sans-serif;color:#17324d;background:#f4f7fa}
body{margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}
.card{background:white;border:1px solid #dce5ed;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #17324d0b}
h1{margin:0 0 6px}p{color:#607386}
input,button,select{font:inherit;padding:11px;border:1px solid #cbd6df;border-radius:8px}
button{background:#0b765e;color:white;border:0;cursor:pointer}
button.secondary{background:#e8eef3;color:#17324d}
form{display:flex;gap:10px;flex-wrap:wrap}
form input{flex:1;min-width:220px}
table{width:100%;border-collapse:collapse;background:white}
th,td{text-align:left;padding:12px;border-bottom:1px solid #e6edf2;vertical-align:top}
th{background:#f7fafc}td select{min-width:130px}
.muted{color:#607386}.hidden{display:none}
.notice{padding:12px;border-radius:8px;background:#fff6dc;color:#745300;margin-top:12px}
.tablewrap{overflow:auto}
small{color:#607386}
@media(max-width:650px){body{padding:12px}.card{padding:14px}th,td{padding:8px;font-size:13px}}
</style>
</head>
<body>
<main class="wrap">
<header>
<h1>Nile Century Hospital</h1>
<p>Reception appointment dashboard</p>
</header>

<section id="login" class="card">
<h2>Staff sign in</h2>
<p>Use the staff account created in Supabase Authentication.</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Staff email" required>
<input id="password" type="password" placeholder="Password" required>
<button>Sign in</button>
</form>
<div id="loginMsg" class="notice hidden"></div>
</section>

<section id="dashboard" class="hidden">
<div class="card" style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
<div><h2 style="margin:0">Appointment requests</h2><small id="who"></small></div>
<div>
<button id="refresh" class="secondary">Refresh</button>
<button id="logout">Sign out</button>
</div>
</div>
<div id="msg" class="notice hidden"></div>
<div class="card tablewrap">
<table>
<thead>
<tr>
<th>Received</th><th>Patient</th><th>Phone</th>
<th>Department / Doctor</th><th>Requested date & time</th>
<th>Status</th><th>Save</th>
</tr>
</thead>
<tbody id="rows">
<tr><td colspan="7">Loading…</td></tr>
</tbody>
</table>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://cmsxkczawawiyoamywnz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_8aJbvv-rmzaF9KUMQoRlig_uv1kNa4u';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);

function message(el,text){
el.textContent=text;
el.classList.remove('hidden');
}

function showSession(session){
$('login').classList.toggle('hidden',!!session);
$('dashboard').classList.toggle('hidden',!session);
if(session){
$('who').textContent=session.user.email;
loadRows();
}
}

$('loginForm').addEventListener('submit',async e=>{
e.preventDefault();
const {error}=await db.auth.signInWithPassword({
email:$('email').value,
password:$('password').value
});
if(error){
message($('loginMsg'),error.message);
return;
}
const {data}=await db.auth.getSession();
showSession(data.session);
});

$('logout').onclick=async()=>{
await db.auth.signOut();
showSession(null);
};

$('refresh').onclick=loadRows;

async function loadRows(){
$('rows').innerHTML='<tr><td colspan="7">Loading…</td></tr>';
const {data,error}=await db.from('appointments')
.select('*')
.order('created_at',{ascending:false})
.limit(300);

if(error){
$('rows').innerHTML='<tr><td colspan="7">Could not load appointments.</td></tr>';
message($('msg'),error.message+' — Confirm this signed-in user has been added to hospital_admins.');
return;
}

if(!data.length){
$('rows').innerHTML='<tr><td colspan="7">No appointment requests yet.</td></tr>';
return;
}

$('rows').innerHTML='';

data.forEach(a=>{
const tr=document.createElement('tr');
const vals=[
new Date(a.created_at).toLocaleString(),
a.patient_name,
a.phone,
a.department_or_doctor,
a.preferred_date+' · '+a.preferred_time
];

vals.forEach(v=>{
const td=document.createElement('td');
td.textContent=v;
tr.appendChild(td);
});

const st=document.createElement('td');
const sel=document.createElement('select');

['pending','confirmed','rejected','completed'].forEach(v=>{
const op=document.createElement('option');
op.value=v;
op.textContent=v;
sel.appendChild(op);
});

sel.value=a.status;
st.appendChild(sel);
tr.appendChild(st);

const action=document.createElement('td');
const btn=document.createElement('button');
btn.textContent='Save';

btn.onclick=async()=>{
btn.disabled=true;
const {error}=await db.from('appointments')
.update({status:sel.value})
.eq('id',a.id);
btn.disabled=false;

if(error){
message($('msg'),error.message);
}else{
message($('msg'),'Appointment status updated.');
}
};

action.appendChild(btn);
tr.appendChild(action);
$('rows').appendChild(tr);
});
}

db.auth.getSession().then(({data})=>showSession(data.session));
db.auth.onAuthStateChange((_event,session)=>showSession(session));
</script>
</body>
</html>
